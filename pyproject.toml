[project]
name = "avengers-bank"
version = "0.1.0"
description = "캡아메리카뱅크(CapAmericaBank) 비동기 FastAPI 백엔드"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "cryptography>=44,<51",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "pwdlib[argon2]>=0.3.1,<1",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "google-genai>=1.0,<2",
    "pgvector>=0.4,<1",
    "kiwipiepy>=0.21,<1",
    "rank-bm25>=0.2.2,<1",
    "mcp>=1.10,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-google-genai>=3.0,<5",
    "langchain-mcp-adapters>=0.1,<1",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "psycopg-pool>=3.2,<4",
    "langchain>=1.0,<2",
    "langfuse>=3,<5",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8,<10",
]

[tool.uv.build-backend]
module-name = "avengers_bank"

[tool.fastapi]
entrypoint = "avengers_bank.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
