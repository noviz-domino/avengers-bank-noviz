<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title description">
<title id="title">CapAmericaBank Multi-Agent Architecture</title>
<desc id="description">START에서 LangGraph Supervisor로 진입한다. Router는 첫 도메인 Agent 또는 END로 이동한다. 계좌, 카드, 예산, 상품 Agent마다 별도의 모델·도구 반복이 실행된다. 각 Agent는 남은 계획의 다음 담당으로 직접 이동하거나 END에서 턴을 마친다. 추가 사용자 메시지는 체크포인트의 상태를 읽고 새 턴을 시작한다. 하단은 결제, 이체, 예산과 PIN 승인 서버 흐름이다.</desc>
