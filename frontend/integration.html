<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>integration</title>
</head>
<body>
  <!-- tests/browser/run-integration.mjs가 여는 점검용 페이지. 열기 전에는 아무 일도 하지 않는다 -->
  <iframe id="app" src="./index.html" width="320" height="800" style="border:0"></iframe>
  <script type="module">
    const frame = document.getElementById("app");
    // about:blank도 complete라서 실제 앱의 load를 기다려야 초기 경로 변경이 탐색을 취소하지 않는다.
    await new Promise((resolve) => (frame.contentWindow.location.pathname.endsWith("/index.html") && frame.contentDocument?.readyState === "complete"
      ? resolve() : frame.addEventListener("load", resolve, { once: true })));
    try {
      const { verifyIntegration } = await import("./integration.browser.mjs");
      const result = await verifyIntegration(frame.contentWindow);
      document.title = "RESULT " + JSON.stringify(result);
    } catch (error) {
      document.title = "ERROR " + error.message;
    }
  </script>
</body>
</html>
