name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # 두 job이 설치하는 의존성이 달라서 캐시를 나눔
          cache-suffix: test
      - run: uv sync --locked
      - run: uv run pytest

  migrations:
    name: 마이그레이션 (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avengers_bank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avengers_bank"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/avengers_bank
      # CI 전용 값. 실제 비밀이 아니다
      JWT_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: migrations
      - run: uv sync --locked --no-dev
      # 빈 DB에 처음부터 끝까지 적용되는지
      - run: uv run alembic upgrade head
      # pgvector 코사인 검색이 실제 PostgreSQL에서 도는지 (pytest는 SQLite라 못 지남)
      - run: uv run python tests/smoke_pgvector.py
      # 모델을 바꾸고 마이그레이션을 안 만들었는지 (CHECK 제약은 감지 못 함 → tests/test_account_number.py)
      - run: uv run alembic check
      # 되돌린 뒤 다시 적용되는지 (downgrade가 남긴 찌꺼기 확인)
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
